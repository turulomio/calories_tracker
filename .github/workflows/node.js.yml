# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main", "269-change-github-action-to-use-django_calories_tracker-docker-image" ]
  pull_request:
    branches: [ "main" ]

env:
  DJANGO_TEST_SERVER_PORT: 8011
  NODE_DEV_SERVER_PORT: 8012

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run E2E django_calories_tracker test server from Docker
      run: |
        docker run -d \
          --name django_test_server \
          -p 8011:8000 \
          -e E2E_TESTING=1 \
          turulomio/django_calories_tracker:e2e

    - name: Wait for Django test server
      run: |
        for i in $(seq 1 30); do
          if curl -s http://127.0.0.1:${{ env.DJANGO_TEST_SERVER_PORT }}/ > /dev/null 2>&1; then
            echo "Django test server is ready and responding!"
            exit 0
          fi
          echo "Waiting for Django test server..."
          sleep 2
        done
        echo "Django test server failed to start"
        docker logs django_test_server
        exit 1

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: CaloriesTracker install and test build
      run: |
        npm install
        npm run build --if-present

    - name: CaloriesTracker e2e test
      run: |
        PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=180000 npx playwright install firefox
        npm run playwright_console

